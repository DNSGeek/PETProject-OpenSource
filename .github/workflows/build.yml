name: Build

# Assemble the editor and every module with cc65, build the .d64 disk
# image, and fail the run if any linker overlap/range error sneaks in.
# This is the only check that actually exercises the 95%-assembly codebase.

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cc65 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65

      - name: Show toolchain versions
        run: |
          ca65 --version
          ld65 --version
          python3 --version

      - name: Build editor, modules, and disk image
        run: bash make_petproject.sh

      - name: Verify build outputs
        run: |
          set -e
          test -s petproject.d64
          test -s build/editor.prg
          for m in modasm moddet moddis moddsk modren modtok modsfr modsct modscr modscrh; do
            test -s "build/${m}.prg"
          done
          echo "All PRGs and the disk image are present."

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: petproject-d64
          path: petproject.d64
          if-no-files-found: error

  # Build against the C128 memory map (zp_c128.inc, layout.inc and the
  # *_c128.cfg linker configs) so the map, its contract asserts and the
  # link-time layout checks are exercised on every change rather than only
  # when someone builds for the C128 by hand.
  c128-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cc65 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65

      - name: Build editor and modules for the C128 memory map
        run: TARGET=c128 bash make_petproject.sh

      - name: Verify C128 build outputs
        run: |
          set -e
          test -s build/c128/editor.prg
          for m in modasm moddet moddis moddsk modren modtok modsfr modsct; do
            test -s "build/c128/${m}.prg"
          done
          test -s build/c128/petproject_c128.d64
          echo "All C128 PRGs and the disk image are present."

      - name: Confirm the script runner refuses the C128 map
        run: |
          for m in modscr modscrh; do
            if ca65 -t none -D TARGET_C128 -o "build/c128/${m}.o" "${m}.asm" 2>/dev/null; then
              echo "${m}.asm assembled under TARGET_C128 but is documented as excluded from the C128 port"
              exit 1
            fi
          done
          echo "modscr/modscrh correctly refuse TARGET_C128."
