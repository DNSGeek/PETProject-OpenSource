# boot128.cfg — links boot128.asm into a raw 256-byte C128 boot sector image
# (no PRG header). make_disk.py --boot-sector writes it to track 1 sector 0.
# The KERNAL reads the sector into $0B00 and runs the code in place.
MEMORY {
    BOOT: start = $0B00, size = $0100, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    CODE: load = BOOT, type = ro;
}
