# modsfr_c128.cfg — linker config for the Search/Replace module, C128 target.
# Same shape as modsfr.cfg, relocated from $C000 to MOD_LO_BASE ($9000):
# HEADER: 2-byte PRG load address at $8FFE-$8FFF
# MAIN:   module code $9000-$97FF (2 KB — code is ~1.9 KB)
# BSS:    module local variables $9800+ (not written to PRG file)

MEMORY {
    HEADER: start = $8FFE, size =   $2, fill = yes, fillval = $00, file = %O;
    MAIN:   start = $9000, size = $800, fill = yes, fillval = $EA, file = %O, define = yes;
    BSS:    start = $9800, size = $100, fill = no,                 file = "";
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    CODE:     load = MAIN,   type = ro;
    BSS:      load = BSS,    type = bss;
}
