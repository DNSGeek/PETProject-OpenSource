# module_c128.cfg — linker config for the "low" modules, C128 target
# (moddet, modtok, moddsk, modren; modscrh is not built for the C128).
#
# Same shape as module.cfg with MAIN moved from $C000 to $9000: on the C128
# $C000-$CFFF is the screen-editor ROM, banked together with the KERNAL, so
# it cannot hold RAM-resident code (see layout.inc). Each module emits its
# PRG header from __MAIN_START__ and asserts at link time that it equals
# MOD_LO_BASE in layout.inc, so this file and layout.inc cannot disagree.
#
# No ZP memory area: modules take zero-page scratch from zp.inc.
MEMORY {
    LOADADDR: start = $0000, size = $0002, file = %O;
    MAIN:     start = $9000, size = $1000, file = %O, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = ro,  define = yes;
    BSS:      load = MAIN,     type = bss, define = yes, optional = yes;
}
