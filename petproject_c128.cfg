# petproject_c128.cfg — linker config for the editor PRG, C128 target.
#
# Assemble editor.asm with -D TARGET_C128 and link with this file
# (TARGET=c128 bash make_petproject.sh does both).
#
# Differences from petproject.cfg — see layout.inc for the reasoning:
#   * MAIN starts at $1BFF so the 2-byte header puts the BASIC stub at
#     $1C01, BASIC 7.0's program start. editor.asm asserts at link time
#     that this matches EDITOR_LOAD in layout.inc.
#   * MAIN ends at $9000, where the relocated 4 K module region begins
#     (module_c128.cfg). If the editor's BSS grows past that, ld65 reports
#     a MAIN overflow — that is the link-time margin check.
#   * ZP is unchanged: the editor's zero-page block stays at $02-$1B on both
#     targets (zp_c128.inc puts the module pool right after it).
MEMORY {
    ZP:   file = "",  start = $02,   size = $1A,            define = yes;
    MAIN: file = %O,  start = $1BFF, size = $9000 - $1BFF,  define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  define = yes;
    LOADADDR: load = MAIN, type = ro;
    STARTUP:  load = MAIN, type = ro,  define = yes;
    CODE:     load = MAIN, type = ro,  define = yes;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
}
